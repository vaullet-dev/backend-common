# Publishes the modules and the BOM to GHCR Maven, on a semver tag.
#
# Tag-driven rather than merge-driven, matching ADR-002's contract pipeline: a version that
# appears in a service's POM should correspond to a commit someone deliberately named, not to
# whatever was on main that afternoon.
#
# All five modules publish together at one version. They share the ErrorType interface and the
# `vaullet.*` property prefix, so a mixed combination is not supported — see ADR-013 §6.
#
# The version is never committed. `-Drevision=` is the whole mechanism (see the parent POM), so
# a release changes no file and there is no "bump the version" commit to forget or to conflict.
name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  # Required to push Maven artifacts to GitHub Packages.
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          # japicmp needs nothing from history, but a shallow clone makes the tag→commit
          # relationship unreadable in the run log when a release goes wrong.
          fetch-depth: 0

      # A tag is a public, immutable statement about compatibility. `v1.2` or `v1.2.3-rc1`
      # would sail through the build and then mean nothing to japicmp's semver comparison,
      # which parses exactly three numeric parts.
      - name: Reject a tag that is not semver
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' is not vMAJOR.MINOR.PATCH. Nothing published."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          # Writes a settings.xml whose `github` server takes the token below, so the
          # distributionManagement block needs no credentials of its own.
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      # This is the gate. japicmp compares every module against its last release and fails
      # when the number does not match the change — a removal tagged v1.4.1 stops here rather
      # than reaching a consumer who trusted the patch digit. See the parent POM.
      - name: Verify, including the semantic-versioning gate
        run: ./mvnw -B --no-transfer-progress -Drevision="$VERSION" verify
        env:
          # japicmp resolves the previous release from GHCR, which requires auth even to read.
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GHCR Maven
        run: ./mvnw -B --no-transfer-progress -Drevision="$VERSION" deploy -DskipTests
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload the API diff
        # The japicmp report says exactly what changed in the public API at this version. It is
        # the evidence behind the number, and worth keeping next to the release rather than
        # regenerating it later from two jars.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-compatibility-${{ github.ref_name }}
          path: '**/target/japicmp/*'
          if-no-files-found: ignore
          retention-days: 90
